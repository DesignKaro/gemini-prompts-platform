name: Web Performance Budgets

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-performance.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-performance.yml'

jobs:
  performance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build -w @gemini-prompts/web

      - name: Enforce performance budgets
        run: npm run perf:budget -w @gemini-prompts/web
