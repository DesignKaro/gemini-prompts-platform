name: Web Performance Budgets

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-performance.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-performance.yml'

jobs:
  performance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build -w @gemini-prompts/web

      - name: Enforce performance budgets
        run: npm run perf:budget -w @gemini-prompts/web

      - name: Enforce PageSpeed mobile guardrails
        env:
          PSI_BASE_URL: ${{ secrets.PSI_BASE_URL }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          PSI_STRATEGY: mobile
          PSI_SCORE_MIN: '80'
          PSI_LCP_MAX: '2500'
          PSI_INP_MAX: '200'
          PSI_CLS_MAX: '0.1'
          PSI_TBT_MAX: '300'
        run: npm run perf:psi:check -w @gemini-prompts/web

      - name: Validate robots.txt directives
        env:
          PSI_BASE_URL: ${{ secrets.PSI_BASE_URL }}
        run: npm run perf:robots:check -w @gemini-prompts/web
