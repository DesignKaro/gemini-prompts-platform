name: Weekly RUM Report

on:
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

jobs:
  rum-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate weekly mobile RUM summary
        env:
          RUM_REPORT_BASE_URL: ${{ secrets.RUM_REPORT_BASE_URL }}
          RUM_REPORT_TOKEN: ${{ secrets.RUM_REPORT_TOKEN }}
          RUM_REPORT_WINDOW_DAYS: '7'
          RUM_REPORT_DEVICE_TYPE: 'mobile'
        run: npm run rum:weekly -w @gemini-prompts/web
